services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: ${TAILSCALE_CONTAINER_NAME:-experiment-tailscale}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=${TS_HOSTNAME:-experiment-host}
      - TS_EXTRA_ARGS=--accept-routes=false --accept-dns=false
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ohashi-sandbox}
    container_name: ${CONTAINER_NAME:-ohashi-sandbox-container}
    volumes:
      # Workspace directory (shared between host and container, same name on both sides)
      - ./workspace:/workspace

      # Persistent storage, mounted at /hdd so it is visible at the container root
      - ${HDD_PATH}:/hdd

      # Specific cache directories
      - ${HDD_PATH}/cache/uv:/root/.cache/uv
      - ${HDD_PATH}/cache/huggingface:/root/.cache/huggingface
      - ${HDD_PATH}/cache/npm:/root/.npm
      - ${HDD_PATH}/cache/dvc:/root/.cache/dvc
      - ${HDD_PATH}/cache/gh:/root/.config/gh
      - ${HDD_PATH}/cache/ms-playwright:/root/.cache/ms-playwright

      # Pre-trained models directory
      - ${HDD_PATH}/models:/root/models

      # Project-local uv cache/venv, relocated off the host root disk
      - ${HDD_PATH}/uv-cache:/workspace/.uv-cache
      - ${HDD_PATH}/venv:/workspace/.venv

      # uv-managed Python runtimes (never persisted before - was lost on every
      # container recreate since .venv/bin/python symlinks into this dir)
      - ${HDD_PATH}/uv-managed:/root/.local/share/uv

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 32gb
    pid: host
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
      - DVC_CACHE_DIR=/hdd/cache/dvc

  # Web UI for browsing the workspace and the HDD from a browser
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: ${FILEBROWSER_CONTAINER_NAME:-ohashi-filebrowser}
    ports:
      - "${FILEBROWSER_BIND:-127.0.0.1}:${FILEBROWSER_PORT:-8080}:80"
    volumes:
      - ${HDD_PATH}:/srv/hdd
      - ./workspace:/srv/workspace
    environment:
      - FB_BASEURL=/
    restart: unless-stopped

volumes:
  tailscale-state:
    name: ${TAILSCALE_STATE_VOLUME:-experiment-tailscale-state}
    external: true
